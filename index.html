<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080b" />

    <!--
      Primary meta.

      The page title leads with the service + city because that is the query
      that brings buyers, and krunalchaudhari.dev already owns the "Krunal
      Chaudhari" name query — two of our own domains should not compete for it.

      og:title below deliberately keeps the name first and drops the city:
      social titles are not indexed, so they are written for humans sharing a
      link, not for search queries.

      All absolute URLs here must use https://www.chaudharikrunal.me — the
      non-www host 301s to it. `assertCanonicalPlugin` in vite.config.js fails
      the build if they ever drift apart.
    -->
    <title>Freelance Web Developer in Surat | Krunal Chaudhari</title>
    <!-- 150 chars: Google truncates around 160, and the geo term leads. -->
    <meta
      name="description"
      content="Freelance web developer in Surat, Gujarat. I build fast, responsive websites and web apps with React, Next.js and Node.js for businesses and startups."
    />
    <meta name="author" content="Krunal Chaudhari" />
    <link rel="canonical" href="https://www.chaudharikrunal.me/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Icons. Modern browsers take the SVG and render it crisp at any size;
         the .ico (16/32/48) covers everything older. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-avatar.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krunal Chaudhari" />
    <meta property="og:url" content="https://www.chaudharikrunal.me/" />
    <meta
      property="og:title"
      content="Krunal Chaudhari | Freelance Web Developer"
    />
    <meta
      property="og:description"
      content="I build modern, fast and responsive websites and web applications for businesses, startups and personal brands."
    />
    <!-- PNG, not SVG: X and several other platforms silently skip SVG previews. -->
    <meta property="og:image" content="https://www.chaudharikrunal.me/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Krunal Chaudhari, freelance full stack web developer - websites that help businesses grow."
    />
    <meta property="og:locale" content="en_IN" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Krunal Chaudhari | Freelance Web Developer"
    />
    <meta
      name="twitter:description"
      content="I build modern, fast and responsive websites and web applications for businesses, startups and personal brands."
    />
    <meta
      name="twitter:image"
      content="https://www.chaudharikrunal.me/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Krunal Chaudhari, freelance full stack web developer - websites that help businesses grow."
    />

    <!-- The hero screenshot is the largest element above the fold: fetch it
         alongside the HTML rather than waiting for React to mount. -->
    <link
      rel="preload"
      as="image"
      href="/hero/showcase-desktop.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Fonts: preconnect early, swap so text paints immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!--
      Structured data. Contains only verifiable facts - no invented ratings,
      review counts, client numbers or founding dates.

      Kept static (rather than generated in React) so crawlers see it without
      running JavaScript. If you change name, phone, price or social links in
      src/config/siteConfig.js, update them here too.
    -->
    <script type="application/ld+json">

            "telephone": "+916351924667",
            "priceRange": "From ₹4,999",
            "currenciesAccepted": "INR",
            "areaServed": [
              {

            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "telephone": "+916351924667",
              "availableLanguage": [
                "en",

            },
            "hasOfferCatalog": {

            }
          },
          {
            "@type": "Person",
            "@id": "https://www.chaudharikrunal.me/#krunal",
            "name": "Krunal Chaudhari",
            "url": "https://www.chaudharikrunal.me/",
            "image": "https://www.chaudharikrunal.me/krunal-chaudhari.webp",
            "jobTitle": "Freelance Full Stack Web Developer",
            "worksFor": {
              "@id": "https://www.chaudharikrunal.me/#business"
            },
            "sameAs": [
              "https://www.krunalchaudhari.dev/",
              "https://www.linkedin.com/in/krunal-chaudhari-2b9ab5354/",
              "https://www.instagram.com/krunalchaudhari.dev",
              "https://www.facebook.com/krunalchaudhari.dev",
              "https://medium.com/@chaudharikrunal0223"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.chaudharikrunal.me/#website",
            "url": "https://www.chaudharikrunal.me/",
            "name": "Krunal Chaudhari | Freelance Web Developer",

            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
